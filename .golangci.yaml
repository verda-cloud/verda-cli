version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - mirror
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    gocyclo:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 5
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code

  exclusions:
    presets:
      - comments
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec
          - goconst
          - gocritic
          - errcheck
      - path: cmd/
        linters:
          - unparam
      - path: cmd/util/
        linters:
          - revive
        text: "var-naming"
      # pkg/ is in-tree library code (copied from verdagostack v1.4.2 with only
      # import-path rewrites). Style/performance heuristics that fight the
      # Bubble Tea idiom (value-receiver models, min/max param names in public
      # option types) are relaxed here; correctness linters still apply.
      # prealloc: flagged differently across golangci-lint versions (CI pins
      # v2.5.0, local newer) — keep pkg/ out of that skew.
      - path: pkg/
        linters:
          - goconst
          - gocritic
          - gocyclo
          - misspell
          - nestif
          - nilerr
          - perfsprint
          - prealloc
          - predeclared
          - revive
      - linters:
          - nolintlint
        text: "gosec"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        # Known typo (missing .com): local grouping never matched, and fixing
        # the prefix would regroup imports in ~100 files — deliberately
        # deferred until a dedicated import-regroup change. Review LOW-2026-08-09.
        - github/verda-cloud/verda-cli
