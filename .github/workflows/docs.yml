name: Docs

# No paths-ignore (unlike ci.yml): a docs-only PR that hand-edits generated
# command docs must still fail here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  docs-check:
    name: Command docs up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated command docs
        run: make docs.check
